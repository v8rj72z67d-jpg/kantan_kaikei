<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>タイムカード計算</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:20px 18px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;opacity:.75}main{max-width:680px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}label{font-size:14px;font-weight:700;display:block;margin-bottom:8px}input[type=file]{width:100%;padding:12px;border:1px dashed #9ca3af;border-radius:12px;background:#f9fafb}button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700}.primary{background:#111827;color:#fff;width:100%;margin-top:10px}.secondary{background:#e5e7eb}.preview{width:100%;max-height:520px;object-fit:contain;border-radius:12px;margin-top:12px;background:#111}.status{font-size:13px;color:#4b5563;margin-top:10px;min-height:20px}.row{display:grid;grid-template-columns:55px 1fr 1fr 34px;gap:7px;align-items:center;margin:8px 0}.row input{width:100%;padding:10px 7px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;text-align:center}.day{font-weight:700}.del{padding:8px;background:#fee2e2;color:#991b1b}.total{font-size:28px;font-weight:800;text-align:center;padding:14px 0 4px}.hint{font-size:12px;color:#6b7280;text-align:center}.hidden{display:none}.error{color:#b91c1c}.ok{color:#047857}</style></head><body><header><h1>⏱ タイムカード計算</h1><div class="sub">写真を撮るだけで勤務時間を計算</div></header><main><section class="card"><label>① タイムカードを撮影</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview hidden"><div id="status" class="status"></div><button id="ocr" class="primary" disabled>写真を読み取る</button></section><section class="card"><label>② 読み取った打刻（必要なら修正）</label><div id="rows"></div><button id="add" class="secondary">＋ 行を追加</button></section><section class="card"><label>③ 休憩時間</label><div style="display:flex;align-items:center;gap:8px"><input id="break" type="number" min="0" value="0" style="width:120px;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px"><span>分 / 1勤務</span></div><button id="calc" class="primary">勤務時間を計算</button><div id="total" class="total">0時間00分</div><div class="hint">退勤が出勤より早い場合は「翌日」として計算します。</div></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const photo=document.getElementById('photo'),preview=document.getElementById('preview'),ocrBtn=document.getElementById('ocr'),status=document.getElementById('status'),rows=document.getElementById('rows'),total=document.getElementById('total');photo.addEventListener('change',()=>{const f=photo.files?.[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.classList.remove('hidden');ocrBtn.disabled=false;status.textContent='写真を選択しました。'});function addRow(day='',start='',end=''){const d=document.createElement('div');d.className='row';d.innerHTML=`<input class="day" placeholder="日" value="${day}"><input class="start" placeholder="19:00" value="${start}"><input class="end" placeholder="0:30" value="${end}"><button class="del">×</button>`;d.querySelector('.del').onclick=()=>{d.remove();calc()};rows.appendChild(d)}document.getElementById('add').onclick=()=>addRow();function normalizeTime(s){s=(s||'').replace(/[：]/g,':').replace(/\s/g,'').replace(/[Oo]/g,'0').replace(/[Il]/g,'1');let m=s.match(/(\d{1,2})[:.](\d{2})/);if(!m)m=s.match(/(\d{2})(\d{2})/);if(!m)return null;let h=+m[1],min=+m[2];if(h>23||min>59)return null;return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')}function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function calc(){let sum=0;document.querySelectorAll('.row').forEach(r=>{const s=normalizeTime(r.querySelector('.start').value),e=normalizeTime(r.querySelector('.end').value);if(!s||!e)return;let a=minutes(s),b=minutes(e);if(b<a)b+=1440;let v=b-a-Math.max(0,+document.getElementById('break').value||0);if(v>=0)sum+=v});total.textContent=`${Math.floor(sum/60)}時間${String(sum%60).padStart(2,'0')}分`;return sum}document.getElementById('calc').onclick=calc;document.getElementById('break').oninput=calc;ocrBtn.onclick=async()=>{const f=photo.files?.[0];if(!f)return;ocrBtn.disabled=true;status.textContent='読み取り中…';try{const result=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`読み取り中… ${Math.round((m.progress||0)*100)}%`}});const lines=result.data.text.split(/\n+/).map(x=>x.trim()).filter(Boolean),found=[];for(const line of lines){const ts=[...line.matchAll(/(?:^|\D)(\d{1,2})[:.](\d{2})(?!\d)/g)].map(m=>m[1]+':'+m[2]);if(ts.length>=2){const ds=line.match(/(?:^|\D)(\d{1,2})(?:日)?\D/);found.push({day:ds?ds[1]:'',start:normalizeTime(ts[0])||'',end:normalizeTime(ts[1])||''})}}rows.innerHTML='';if(!found.length){status.innerHTML='<span class="error">自動認識できませんでした。下の行に入力してください。</span>';addRow();addRow();addRow()}else{found.forEach(x=>addRow(x.day,x.start,x.end));status.innerHTML='<span class="ok">読み取り完了。間違いがあれば修正してください。</span>';calc()}}catch(e){status.innerHTML='<span class="error">読み取りに失敗しました。手入力で修正できます。</span>';addRow();addRow()}finally{ocrBtn.disabled=false}};</script></body></html>
